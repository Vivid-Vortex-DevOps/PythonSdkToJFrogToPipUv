name: Build and Publish to JFrog PyPI

# Triggers:
#   • pushing a version tag  (git tag v0.1.0 && git push --tags)
#   • manual run from the Actions tab
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Show artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to JFrog Artifactory (PyPI repo)
    needs: build
    runs-on: ubuntu-latest

    # Required GitHub secrets:
    #   JFROG_PYPI_URL   — e.g. https://mycompany.jfrog.io/artifactory/api/pypi/pypi-local/
    #   JFROG_USERNAME   — Artifactory user (or _)
    #   JFROG_PASSWORD   — Artifactory password or API key / identity token
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to JFrog
        env:
          TWINE_USERNAME: ${{ secrets.JFROG_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
          JFROG_PYPI_URL: ${{ secrets.JFROG_PYPI_URL }}
        run: |
          twine upload \
            --repository-url "${JFROG_PYPI_URL}" \
            dist/*
